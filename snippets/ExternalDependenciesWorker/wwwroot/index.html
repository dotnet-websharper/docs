<!DOCTYPE html>
<html lang="en">
<head>
    <title>ExternalDependenciesWorker</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        /* Don't show the not-yet-loaded templates */
        [ws-template], [ws-children-template] { display: none; }
    </style>
    <script type="text/javascript" src="Scripts/ExternalDependenciesWorker.head.js"></script>
</head>
<body>
    <h1>Using extenal dependencies Web Worker Example</h1>
    <div id="main" ws-children-template="Main">
        <button ws-onclick="RunWorker">Run worker</button>
        <p>${WorkerResponse}</p>
    </div>
    <script type="module" src="Scripts/ExternalDependenciesWorker.min.js"></script>
</body>
</html>
